<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>展示牆預覽</title>
<style>
  :root{
    --bg:#05060d; --ink:#f4f1e8; --sub:rgba(235,229,214,.62);
    --gold:#e6b476; --ice:#b7e2ee; --card:rgba(16,24,48,.78);
    --edge:linear-gradient(140deg,rgba(183,226,238,.28),rgba(242,236,220,.10) 34%,rgba(230,180,118,.22) 70%,rgba(246,220,171,.18));
    --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    --display:"Songti TC","Noto Serif CJK TC","PMingLiU",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);padding:20px 16px 28px}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  h1{font-family:var(--display);font-size:1.4rem;
    background:linear-gradient(97deg,var(--gold),#cfd8ff 50%,var(--ice));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .totals{font-weight:700;color:var(--gold)}
  .hint{font-size:.85rem;color:var(--sub);margin-bottom:14px}
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .tile{
    background:linear-gradient(var(--card),var(--card)) padding-box,var(--edge) border-box;
    border:1px solid transparent;border-radius:14px;padding:12px;
  }
  .tile .seat{font-weight:800}
  .tile .prod{font-size:.78rem;color:var(--sub);margin-top:2px}
  .tile .flag{margin-top:6px;font-size:.75rem;color:var(--sub)}
  .tile.show{box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(230,180,118,.22)}
  .tile.show .flag{color:var(--gold);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>成果展示牆</h1>
  <span class="totals">① 11/14　② 8/14　③ 6/14</span>
</header>
<p class="hint">金框＝作者自願展示。這是示範預覽，不是現場真資料。</p>
<div class="wall" id="wall"></div>
<script>
  var prods = ["①課表","②回饋單","③工具"];
  var show = {1:1,3:1,5:1,8:1,12:1};
  var wall = document.getElementById("wall");
  for (var i = 1; i <= 14; i++){
    var t = document.createElement("div");
    var on = !!show[i];
    t.className = "tile" + (on ? " show" : "");
    t.innerHTML = "<div class='seat'>座號 " + String(i).padStart(2,"0") + "</div>" +
      "<div class='prod'>" + prods[i % 3] + " 已交</div>" +
      "<div class='flag'>" + (on ? "自願展示" : "") + "</div>";
    wall.appendChild(t);
  }
</script>
</body>
</html>
